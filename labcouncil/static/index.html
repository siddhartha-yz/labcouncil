<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabCouncil · 研究群</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar"><div class="sidebar-header"><a href="/" class="brand">LabCouncil</a><button id="new-project" aria-label="新建研究群" title="新建研究群">＋</button></div><label class="sr-only" for="group-search">搜索研究群</label><input id="group-search" type="search" placeholder="搜索研究群"><nav id="projects" aria-label="研究群列表"></nav></aside>
    <main>
      <header class="topbar"><button id="toggle-projects" aria-controls="sidebar" aria-expanded="false">‹ 群聊</button><div class="heading"><h1 id="project-title">新的研究群</h1><div class="group-status"><span class="badge">本地模拟原型</span><span id="work-status"></span></div></div><div id="project-actions"></div></header>
      <div id="message" role="status" aria-live="polite"></div>
      <div id="content"><p>请通过本地服务打开研究群。</p></div>
      <div id="compose-area"></div>
      <footer>讨论不会改变执行计划，下一轮需明确确认。</footer>
    </main>
  </div>
  <dialog id="settings" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">群聊设置</h2><button id="close-settings" aria-label="关闭详情">关闭</button></div><div id="settings-body"></div></dialog>
</body>
</html>
