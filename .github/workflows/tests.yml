name: Local prototype tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify durable local workflow (no model calls)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check labcouncil/static/app.js
      - name: Verify evidence score computation (no model calls)
        run: python -W error::ResourceWarning -m unittest discover -s reproductions -p test_score_comparison.py -v
